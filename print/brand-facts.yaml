    paper:      {palette: cream,        status: inferred}   # body is #fff but cream is the named light surface (hero, reviews)
    ink:        {palette: ink,          status: inferred, contrast: 17.21}
    accent:     {palette: gold,         status: inferred, contrast: 1.55}   # graphics and display type only
    accent-ink: {palette: eyebrow-dark, status: inferred, contrast: 9.38}   # darkest gold-hue entry passing 4.5:1; eyebrow-gold fails at 3.86
    muted:      {palette: muted,        status: inferred, contrast: 5.25}
